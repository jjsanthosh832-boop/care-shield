spring.application.name=portal
server.port=8080

# MySQL Settings - Local instance MySQL267 (MySQL 8.0 CE)
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql26
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA Hibernate Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Bootstrap master admin - this email is always ADMIN, all others register as USER.
# Only an ADMIN can promote/demote other users via PUT /api/admin/users/{id}/role
app.admin-email=jjsanthosh832@gmail.com

# File upload properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
